name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game
        uses: Platane/snk@v3
        with:
          github_user_name: hariskhan1613
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=60A5FA&color_dots=1F2937,0F172A,111827,1E293B,0B1120

      - name: Push snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}